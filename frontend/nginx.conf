server {
  listen 80;
  server_name _;
  client_max_body_size 25m;  # 附件上限 20MB + 表单开销
  root /usr/share/nginx/html;
  server_tokens off;

  # 接口：安全响应头由后端统一设置（见 backend/src/security-headers.ts），此处不重复添加
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # 注意：nginx 的 add_header 不会从上层继承到已有 add_header 的 location，所以每个静态 location 都完整列出安全头
  # CSP：构建产物没有内联脚本；Ant Design 使用内联样式，style-src 需要 'unsafe-inline'
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;
  }

  location / {
    try_files $uri /index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;
    # 启用 HTTPS 后取消注释：
    # add_header Strict-Transport-Security "max-age=31536000" always;
  }
}
