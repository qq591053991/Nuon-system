# 一键部署：docker compose up -d   →  浏览器打开 http://<服务器IP>:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nuon
      POSTGRES_USER: nuon
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nuon_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuon -d nuon"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://nuon:${DB_PASSWORD:-nuon_change_me}@db:5432/nuon
      SECRET_KEY: ${SECRET_KEY:-please-set-a-long-random-secret-key-in-env-file}
      TZ_NAME: Asia/Shanghai
      SEED_ON_START: "1"
      SEED_DEMO: ${SEED_DEMO:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  pgdata:
